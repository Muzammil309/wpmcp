name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint + Smoke (gate)
        run: |
          find includes admin -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/smoke.php

      - name: Verify tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' wpmcp.php | head -n1)
          echo "tag=$TAG header=$HEADER"
          [ "$TAG" = "$HEADER" ] || { echo "::error::Tag v$TAG does not match plugin version $HEADER"; exit 1; }

      - name: Build zip
        run: python3 scripts/build_zip.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/wpmcp-*.zip
